name: test-cron

on:
  schedule:
    - cron: "*/5 * * * *"    # toutes les 5 minutes, l'intervalle minimum de GitHub
  workflow_dispatch:          # pour pouvoir le lancer à la main

permissions:
  contents: read

jobs:
  message:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher un message
        run: |
          echo "Test du déclenchement planifié"
          echo "Événement : ${{ github.event_name }}"
          echo "Expression cron : ${{ github.event.schedule }}"
          echo "Heure UTC : $(date -u '+%H:%M:%S')"
          echo "Heure Paris : $(TZ=Europe/Paris date '+%H:%M:%S')"
