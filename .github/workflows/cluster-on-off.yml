name: Horaires du cluster

on:
  schedule:
    - cron: "15 17 * * *" 
      timezone: "Europe/Paris"
    - cron: "20 17 * * *"
      timezone: "Europe/Paris"

permissions:
  contents: read
  id-token: write

jobs:
  node-pool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          project_id: form-gke-eleve02-618b
          workload_identity_provider: projects/967899955534/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: foodtrack-ci@form-gke-eleve02-618b.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Allumer le cluster
        if: github.event.schedule == '15 17 * * *'
        env:
          ZONE: europe-west3-b
        run: bash scripts/cluster-nightswitch.sh on

      - name: Eteindre le cluster
        if: github.event.schedule == '20 17 * * *'
        env:
          ZONE: europe-west3-b
        run: bash scripts/cluster-nightswitch.sh off