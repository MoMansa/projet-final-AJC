apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: foodtrack-dev

resources:
  - namespace.yaml
  - ingress.yaml
  - ../../base

replicas:
  - name: portail-qualite
    count: 1

patches:
  - path: patch-configmap.yaml
    target:
      kind: ConfigMap
      name: foodtrack-config
  - path: patch-hpa.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: api-capteurs
  - target:
      kind: StatefulSet
      name: cache-releves
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 20Gi

secretGenerator:
  - name: foodtrack-api-config
    envs:
      - secret.env
