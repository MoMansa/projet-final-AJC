apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: foodtrack-dev

resources:
  - namespace.yaml
  - ingress.yaml
  - ../../base

replicas:
  - name: portail-qualite
    count: 1
  - name: api-capteurs
    count: 1

patches:
  - path: patch-configmap.yaml
    target:
      kind: ConfigMap
      name: foodtrack-config

secretGenerator:
  - name: foodtrack-api-config
    envs:
      - secret.env
